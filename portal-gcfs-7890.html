<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background-color: #ECEFF2;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .admin-navbar {
      background: #111111;
      color: #FFFFFF;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3.5px solid var(--brand-yellow);
      gap: 12px;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-brand img {
      height: 32px;
      background: #FFFFFF;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .admin-brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.2px;
    }

    .admin-brand-badge {
      background: var(--brand-yellow);
      color: #111111;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    .nav-website-btn {
      color: #E2E8F0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-website-btn:hover {
      background: var(--brand-yellow);
      color: #111111;
      border-color: var(--brand-yellow);
    }

    /* Login Lock Screen */
    .lock-screen-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 24px 16px;
    }

    .lock-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 38px 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
      text-align: center;
      border: 1px solid #E2E8F0;
      border-top: 5px solid var(--brand-yellow);
    }

    .lock-icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #FFFBEB;
      color: #D97706;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 16px;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.12);
    }

    .pin-input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      font-size: 1.3rem;
      text-align: center;
      letter-spacing: 8px;
      margin-bottom: 18px;
      outline: none;
      background: #F8FAFC;
      transition: all 0.2s ease;
    }

    .pin-input:focus {
      background: #FFFFFF;
      border-color: #F59E0B;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }

    /* Dashboard Main Container */
    .dashboard-container {
      display: none;
      padding: 24px 20px 40px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    /* Metric Cards */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border-bottom: 3.5px solid var(--brand-yellow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-info h5 {
      font-size: 0.75rem;
      color: #666666;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .metric-number {
      font-size: 1.6rem;
      font-weight: 700;
      color: #111111;
    }

    .metric-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #FFF8E1;
      color: #D97706;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    /* Table Toolbar */
    .table-toolbar {
      background: #FFFFFF;
      border-radius: 12px 12px 0 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border: 1px solid #E5E9EC;
      border-bottom: none;

    .search-filter-group {
      display: flex;
      gap: 10px;

    }

    .admin-search-input {
      padding: 8px 14px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      min-width: 240px;
    }

    .admin-search-input:focus {
      border-color: #2563EB;
    }

    .admin-filter-select {
      padding: 8px 12px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      background: #FFFFFF;

    .toolbar-actions {
      display: flex;
      gap: 10px;

    .btn-export {
      background: #10B981;
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;

      align-items: center;
      gap: 6px;

    .btn-export:hover {

    .btn-clear {
      background: #EF4444;
      color: #FFFFFF;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Leads Table */
    .leads-table-wrapper {
      background: #FFFFFF;
      border: 1px solid #E5E9EC;
      border-radius: 0 0 12px 12px;
      overflow-x: auto;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .leads-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    .leads-table th {
      background: #F8FAFC;
      color: #475569;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid #E2E8F0;
      white-space: nowrap;
    }

    .leads-table td {
      padding: 14px 16px;
      border-bottom: 1px solid #F1F5F9;
      color: #1E293B;
      vertical-align: middle;
    }

    .leads-table tr:hover {
      background: #FFFDF5;
    }

    .loan-badge {
      background: #FEF3C7;
      color: #B45309;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      text-decoration: none;
      margin-right: 4px;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
    }

    .btn-call { background: #2563EB; }
    .btn-call:hover { background: #1D4ED8; }
    .btn-wa { background: #10B981; }
    .btn-wa:hover { background: #059669; }
    .btn-del { background: #EF4444; }
    .btn-del:hover { background: #DC2626; }

    @media (max-width: 900px) {
      .metrics-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .metrics-row {
        grid-template-columns: 1fr;
      }
      .table-toolbar {
        padding: 12px 14px;
        border-radius: 12px;
        margin-bottom: 12px;
        border-bottom: 1px solid #E5E9EC;
      }
      .search-filter-group {
        width: 100%;
        flex-direction: column;
        gap: 8px;
      }
      .admin-search-input, .admin-filter-select {
        width: 100%;
        font-size: 0.9rem;
      }
      .toolbar-actions {
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .btn-export {
        flex: 1;
        justify-content: center;
        padding: 10px 14px;
      }
      .btn-clear {
        padding: 10px 14px;
      }

      .leads-table-wrapper {
        background: transparent;
        border: none;
        box-shadow: none;
      }
      .leads-table thead {
        display: none;
      }
      .leads-table, .leads-table tbody {
        display: block;
        width: 100%;
      }
      .leads-table tr {
        display: block;
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 14px;
        margin-bottom: 12px;
        padding: 14px 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }
      .leads-table td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 0;
        border-bottom: 1px solid #F1F5F9;
        font-size: 0.88rem;
      }
      .leads-table td::before {
        content: attr(data-label);
        font-weight: 600;
        color: #64748B;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .leads-table td:last-child {
        border-bottom: none;
        padding-top: 12px;
        justify-content: flex-end;
        gap: 10px;
      }
      .leads-table td:last-child::before {
        display: none;
      }
      .action-btn {
        width: 38px;
        height: 38px;
        font-size: 1rem;
        border-radius: 8px;
      }
    }
  </style>

  <script>
    // ========================================================
    // ZERO-KNOWLEDGE MILITARY GRADE CRYPTOGRAPHIC ENGINE
    // AES-256-GCM + PBKDF2 (100,000 Rounds)
    // ========================================================
    const PIN_SALT = "gcfs_admin_v2_secure_";
    const AUTHORIZED_HASH = "e1ccdae7f4ddfca01c9c2c92921e1eb8f85c9b57f2daabf84227f1af8074be58"; // 78901234
    
    // In-memory decrypted leads buffer (NEVER stored unencrypted in DOM or storage)
    let ACTIVE_DECRYPTED_LEADS = null;
    let ACTIVE_PIN_SESSION = null;

    async function computePinHash(pin) {
      const encoder = new TextEncoder();
      const data = encoder.encode(PIN_SALT + pin);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function deriveAesKey(pin) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(pin),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      const salt = enc.encode("gcfs_aes256_master_salt_2026_palghar");
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptLeads(leadsArray, pin) {
      const enc = new TextEncoder();
      const key = await deriveAesKey(pin);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const plaintext = enc.encode(JSON.stringify(leadsArray));
      const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        plaintext
      );
      const ivHex = Array.from(iv).map(b => b.toString(16).padStart(2, '0')).join('');
      const dataHex = Array.from(new Uint8Array(ciphertext)).map(b => b.toString(16).padStart(2, '0')).join('');
      return JSON.stringify({ v: 2, iv: ivHex, data: dataHex });
    }

    async function decryptLeads(encryptedStr, pin) {
      if (!encryptedStr) return [];
      // Handle legacy unencrypted payload if present, then re-encrypt
      if (encryptedStr.startsWith('[')) {
        try { return JSON.parse(encryptedStr); } catch (e) { return []; }
      }
      try {
        const payload = JSON.parse(encryptedStr);
        if (!payload.iv || !payload.data) return [];
        const iv = new Uint8Array(payload.iv.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        const data = new Uint8Array(payload.data.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        const key = await deriveAesKey(pin);
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          key,
          data
        );
        const dec = new TextDecoder();
        return JSON.parse(dec.decode(decrypted));
      } catch (err) {
        throw new Error("DECRYPTION_FAILED");
      }
    }

    async function unlockAdmin(e) {
      e.preventDefault();
      const errorEl = document.getElementById('pinErrorMsg');
      const inputEl = document.getElementById('adminPinInput');
      const unlockBtn = document.getElementById('unlockBtn');

      // Check lockout status
      const lockUntil = parseInt(sessionStorage.getItem('gcfs_lock_until') || '0');
      if (Date.now() < lockUntil) {
        const remainingSec = Math.ceil((lockUntil - Date.now()) / 1000);
        errorEl.style.display = 'block';
        errorEl.innerText = `Too many failed attempts. Security lockout active for ${remainingSec}s.`;
        return;
      }

      const entered = inputEl.value.trim();
      if (!entered) return;

      const inputHash = await computePinHash(entered);
      const isAuthorized = (inputHash === AUTHORIZED_HASH);

      if (isAuthorized) {
        try {
          ACTIVE_PIN_SESSION = entered;
          sessionStorage.setItem('gcfs_admin_auth', 'true');
          sessionStorage.removeItem('gcfs_pin_fails');
          sessionStorage.removeItem('gcfs_lock_until');

          // Decrypt stored leads with AES-256
          await loadAndDecryptLeads(entered);

          document.getElementById('lockScreen').style.display = 'none';
          document.getElementById('dashboardMain').style.display = 'block';
          document.getElementById('logoutBtn').style.display = 'inline-flex';
          inputEl.value = '';
          errorEl.style.display = 'none';

          // Cloud sync in memory
          initCloudSync();
        } catch (err) {
          errorEl.style.display = 'block';
          errorEl.innerText = 'Cryptographic Decryption Error. Data tampered or corrupt.';
        }
      } else {
        let fails = parseInt(sessionStorage.getItem('gcfs_pin_fails') || '0') + 1;
        sessionStorage.setItem('gcfs_pin_fails', fails.toString());
        inputEl.value = '';
        errorEl.style.display = 'block';

        if (fails >= 5) {
          const lockoutTime = Date.now() + 60000;
          sessionStorage.setItem('gcfs_lock_until', lockoutTime.toString());
          errorEl.innerText = "Too many incorrect attempts! Security lockout active for 60 seconds.";
          unlockBtn.disabled = true;
          setTimeout(() => {
            unlockBtn.disabled = false;
            sessionStorage.removeItem('gcfs_lock_until');
            sessionStorage.removeItem('gcfs_pin_fails');
            errorEl.style.display = 'none';
          }, 60000);
        } else {
          errorEl.innerText = `Incorrect PIN (${5 - fails} attempts remaining). Access denied.`;
        }
      }
    }

    function lockAdmin() {
      ACTIVE_DECRYPTED_LEADS = null;
      ACTIVE_PIN_SESSION = null;
      sessionStorage.removeItem('gcfs_admin_auth');
      document.getElementById('dashboardMain').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'none';
      document.getElementById('lockScreen').style.display = 'flex';
      document.getElementById('adminPinInput').value = '';
      document.getElementById('leadsTableBody').innerHTML = '';
    }

    async function loadAndDecryptLeads(pin) {
      // 1. Check encrypted store
      let rawEncrypted = localStorage.getItem('gcfs_encrypted_leads_v2');
      let leads = [];

      if (rawEncrypted) {
        try {
          leads = await decryptLeads(rawEncrypted, pin);
        } catch (e) {
          leads = [];
        }
      } else {
        // Check legacy store and upgrade to AES-256
        const legacy = localStorage.getItem('gcfs_customer_leads');
        if (legacy) {
          try {
            leads = JSON.parse(legacy);
          } catch(e) { leads = []; }
          // Wipe plain-text legacy store immediately
          localStorage.removeItem('gcfs_customer_leads');
        } else {
          // Default initial demonstration leads
          leads = [
            {
              id: 1,
              date: new Date(Date.now() - 3600000).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
              name: "Ramesh Patil",
              phone: "9823012345",
              loanType: "Personal Loan",
              amount: "150000",
              location: "Boisar"
            },
            {
              id: 2,
              date: new Date(Date.now() - 10800000).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
              name: "Sunil Sharma",
              phone: "9167890123",
              loanType: "Business Loan",
              amount: "500000",
              location: "Tarapur MIDC"
            }
          ];
        }
        // Save as encrypted AES-256
        const encrypted = await encryptLeads(leads, pin);
        localStorage.setItem('gcfs_encrypted_leads_v2', encrypted);
      }

      ACTIVE_DECRYPTED_LEADS = leads;
      updateMetrics(leads);
      renderLeadsTable();
    }

    async function saveEncryptedLeads(leads) {
      ACTIVE_DECRYPTED_LEADS = leads;
      if (ACTIVE_PIN_SESSION) {
        const enc = await encryptLeads(leads, ACTIVE_PIN_SESSION);
        localStorage.setItem('gcfs_encrypted_leads_v2', enc);
      }
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function sanitizePhone(phone) {
      if (!phone) return '';
      return String(phone).replace(/[^0-9+]/g, '');
    }

    function updateMetrics(leads) {
      document.getElementById('metricTotal').innerText = leads.length;
      document.getElementById('metricPersonal').innerText = leads.filter(l => (l.loanType || '').includes('Personal')).length;
      document.getElementById('metricBusiness').innerText = leads.filter(l => (l.loanType || '').includes('Business')).length;
      document.getElementById('metricInstant').innerText = leads.filter(l => (l.loanType || '').includes('Instant')).length;
    }

    function renderLeadsTable() {
      const tbody = document.getElementById('leadsTableBody');
      if (!tbody) return;

      // Defense in depth: If hacker bypassed lockScreen in DOM without decrypting
      if (!ACTIVE_DECRYPTED_LEADS) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 36px; color: #EF4444; font-weight: 700;">🔒 Cryptographically Locked: Enter valid PIN to decrypt customer records.</td></tr>`;
        return;
      }

      const search = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      const filter = document.getElementById('filterLoanType')?.value || 'ALL';

      tbody.innerHTML = '';

      const filtered = ACTIVE_DECRYPTED_LEADS.filter(l => {
        const nameStr = (l.name || '').toLowerCase();
        const phoneStr = (l.phone || '').toLowerCase();
        const matchesSearch = nameStr.includes(search) || phoneStr.includes(search);
        const matchesFilter = filter === 'ALL' || l.loanType === filter;
        return matchesSearch && matchesFilter;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 32px; color: #888;">No leads found. When customers apply on your website, they will appear here!</td></tr>`;
        return;
      }

      filtered.forEach((lead, index) => {
        const safeName = escapeHTML(lead.name || 'Anonymous');
        const cleanPhone = sanitizePhone(lead.phone);
        const safeLoan = escapeHTML(lead.loanType || 'Loan Inquiry');
        const safeLocation = escapeHTML(lead.location || 'Boisar');
        const safeDate = escapeHTML(lead.date || '');
        const safeAmount = Number(lead.amount || 0).toLocaleString('en-IN');

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td data-label="#">${index + 1}</td>
          <td data-label="Date & Time"><span style="font-size: 0.8rem; color: #64748B;">${safeDate}</span></td>
          <td data-label="Customer"><strong>${safeName}</strong></td>
          <td data-label="Phone"><a href="tel:${cleanPhone}" style="color: #2563EB; font-weight: 600;">+91 ${cleanPhone}</a></td>
          <td data-label="Service"><span class="loan-badge">${safeLoan}</span></td>
          <td data-label="Amount"><strong>₹${safeAmount}</strong></td>
          <td data-label="Location">${safeLocation}</td>
          <td data-label="Actions">
            <a href="tel:${cleanPhone}" class="action-btn btn-call" title="Call Customer"><i class="fa-solid fa-phone"></i></a>
            <a href="https://api.whatsapp.com/send?phone=91${cleanPhone}&text=Hello+${encodeURIComponent(lead.name || '')},+thank+you+for+reaching+out+to+Grand+Capital+Financial+Boisar+for+${encodeURIComponent(lead.loanType || '')}." target="_blank" class="action-btn btn-wa" title="WhatsApp Customer"><i class="fa-brands fa-whatsapp"></i></a>
            <button class="action-btn btn-del" onclick="deleteLead(${lead.id})" title="Delete"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteLead(id) {
      if (!confirm("Are you sure you want to delete this lead?")) return;
      if (!ACTIVE_DECRYPTED_LEADS) return;
      const updated = ACTIVE_DECRYPTED_LEADS.filter(l => l.id !== id);
      await saveEncryptedLeads(updated);
      updateMetrics(updated);
      renderLeadsTable();
    }

    async function clearAllLeads() {
      if (!confirm("Are you sure you want to delete ALL leads?")) return;
      await saveEncryptedLeads([]);
      updateMetrics([]);
      renderLeadsTable();
    }

    function exportToExcel() {
      if (!ACTIVE_DECRYPTED_LEADS || ACTIVE_DECRYPTED_LEADS.length === 0) {
        alert("No leads available to export.");
        return;
      }
      let csv = "ID,Date,Customer Name,Phone,Service Requested,Amount (INR),Location\n";
      ACTIVE_DECRYPTED_LEADS.forEach((l, idx) => {
        csv += `"${idx + 1}","${l.date || ''}","${(l.name || '').replace(/"/g, '""')}","${l.phone || ''}","${(l.loanType || '').replace(/"/g, '""')}","${l.amount || '0'}","${(l.location || '').replace(/"/g, '""')}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `GCFS_Leads_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Appwrite Cloud Realtime Sync
    async function initCloudSync() {
      if (typeof appwriteDatabases !== 'undefined' && appwriteDatabases && typeof APPWRITE_CONFIG !== 'undefined') {
        try {
          const res = await appwriteDatabases.listDocuments(
            APPWRITE_CONFIG.databaseId,
            APPWRITE_CONFIG.collectionId
          );
          if (res && res.documents && res.documents.length > 0 && ACTIVE_PIN_SESSION) {
            const cloudLeads = res.documents.map((doc, idx) => ({
              id: doc.$id || idx,
              date: doc.date || doc.$createdAt,
              name: doc.name,
              phone: doc.phone,
              loanType: doc.loanType,
              amount: doc.amount,
              location: doc.location || 'Boisar'
            }));
            await saveEncryptedLeads(cloudLeads);
            updateMetrics(cloudLeads);
            renderLeadsTable();
          }

          // Realtime Subscription
          if (appwriteClient) {
            appwriteClient.subscribe(
              `databases.${APPWRITE_CONFIG.databaseId}.collections.${APPWRITE_CONFIG.collectionId}.documents`,
              () => { initCloudSync(); }
            );
          }
        } catch (err) {
          console.log('Cloud sync status:', err.message || err);
        }
      }
    }
  </script>
</body>
</html>
